name: Eglantine MKW Windows x64 build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out the exact source used for this patch
        uses: actions/checkout@v4
        with:
          repository: rcl0ng/Eglantine
          ref: 6be10b5c126a0faf88ffba00ff9ffeb9cd3f8c8e
          persist-credentials: false

      - name: Apply the persistent MKW settings patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = [Convert]::FromBase64String('')
          [IO.File]::WriteAllBytes((Join-Path $PWD 'mkw-settings.patch'), $patch)
          if ((Get-FileHash mkw-settings.patch -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8aae27bd3c618135f8092a9aae6bb11a1e6595facf078efc5eafbd3a63fce14a') {
            throw 'Embedded patch checksum mismatch'
          }
          git apply --check mkw-settings.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch check failed' }
          git apply mkw-settings.patch
          if ($LASTEXITCODE -ne 0) { throw 'Patch apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace check failed' }
          # Record the patched source without calling it an upstream release.
          'mkw-settings-custom' | Set-Content -Encoding ascii GIT-REFSPEC
          '6be10b5c126a0faf88ffba00ff9ffeb9cd3f8c8e' | Set-Content -Encoding ascii GIT-COMMIT
          'mkw-settings-custom' | Set-Content -Encoding ascii GIT-TAG

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      # The repository SDK script uses Get-WmiObject, requiring Windows PowerShell 5.1.
      - name: Install the repository-pinned Vulkan SDK
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Configure Release with tests
        shell: pwsh
        run: |
          cmake -S . -B build/release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON -DYUZU_TESTS=ON `
            -DENABLE_QT=ON -DYUZU_CMD=ON `
            -DYUZU_ROOM=OFF -DYUZU_ROOM_STANDALONE=OFF `
            -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_USE_BUNDLED_SDL3=ON `
            -DENABLE_QT_TRANSLATION=ON -DENABLE_UPDATE_CHECKER=OFF `
            -DUSE_DISCORD_PRESENCE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build the emulator and tests
        shell: pwsh
        run: |
          cmake --build build/release --target yuzu yuzu-cmd tests --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Run focused MKW regression tests
        shell: pwsh
        run: |
          & ./build/release/bin/tests.exe '[game_presets]' 2>&1 | Tee-Object test-results.txt
          if ($LASTEXITCODE -ne 0) { throw 'MKW regression tests failed' }

      - name: Stage the Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($exe in 'eglantine.exe', 'eden-cli.exe') {
            if (-not (Test-Path "build/release/bin/$exe")) { throw "Missing $exe" }
          }
          windeployqt --release --no-translations build/release/bin/eglantine.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/release/bin/* package/
          Remove-Item package/tests.exe -ErrorAction SilentlyContinue
          Copy-Item LICENSE.txt, mkw-settings.patch, test-results.txt package/
          Copy-Item docs/nx2/mkw-launch-settings.md package/README-MKW.md
          # Include the complete corresponding source for this custom binary.
          git archive --format=zip --output=package/upstream-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          @'
          Custom Eglantine MKW settings build.
          Base commit: 6be10b5c126a0faf88ffba00ff9ffeb9cd3f8c8e
          Apply mkw-settings.patch to upstream-source.zip to reconstruct the patched source.
          No game, keys, firmware, emulator configuration or saves are included.
          Read README-MKW.md before replacing your existing installation.
          This workflow tests preset logic; actual game launches remain untested.
          '@ | Set-Content -Encoding utf8 package/BUILD-INFO.txt

      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-mkw-windows-x64
          path: package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-mkw-test-results
          path: test-results.txt
          if-no-files-found: ignore
